# Build the Windows app, sign it with SignPath (free for approved open-source projects),
# and attach the installers to a GitHub Release.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT GETS PUBLISHED
#   The UNSIGNED installers are attached to the Release FIRST, as soon as the build finishes, so a release always has
#   downloadable .exe files and the in-app updater can point at them. If the SignPath setup below is done, the SIGNED
#   installers are attached on top (same names, replacing the unsigned ones).
#
# ONE-TIME SETUP FOR SIGNING (optional; the release works without it):
#   1) Push this repo to GitHub and make it PUBLIC.
#   2) Apply to SignPath Foundation (free OSS signing):  https://signpath.org/apply
#      — you get an ORGANIZATION ID and a signing POLICY.
#   3) In SignPath: connect this GitHub repo, create a PROJECT for it, and add an
#      ARTIFACT CONFIGURATION that signs the *.exe files inside the uploaded zip.
#   4) Add the repo secret  SIGNPATH_API_TOKEN  (GitHub → Settings → Secrets and
#      variables → Actions → New repository secret).
#   5) Fill the three slugs marked TODO below to match your SignPath org/project/policy,
#      and set the repo variable  SIGNPATH_ENABLED=1  (Settings → Variables → Actions).
# Until then the signing steps are skipped, and every release still ships the unsigned installers.
# ─────────────────────────────────────────────────────────────────────────────

name: Release (build + sign)

on:
  push:
    tags: ["v*"]            # push a tag like v1.0.1 to cut a signed release
  workflow_dispatch: {}     # or run it by hand from the Actions tab

permissions:
  contents: write           # create the GitHub Release
  actions: read             # let the SignPath action download the build artifact

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # keep the write token out of .git/config, away from npm install scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # Electron 45 / @electron/rebuild need Node >= 22.12

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app (unsigned)
        run: npm run build        # -> dist/TryDesk-Portable.exe, dist/TryDesk-Setup-<ver>.exe

      # The release notes come from the root CHANGELOG.md (the desktop app's), one section per version. The tag is
      # the version ("v1.3.8" -> the "## [1.3.8]" section). A tag with no section fails here on purpose: a release
      # without notes is worse than a red build. This runs before SignPath so the notes are published even while the
      # signing placeholders below are still unfilled.
      - name: Write the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p out
          node scripts/changelog.mjs "${GITHUB_REF_NAME}" > out/release-notes.md
          head -n 5 out/release-notes.md

      - name: Upload unsigned build as a workflow artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: trydesk-unsigned
          path: dist/*.exe
          if-no-files-found: error

      # Publish the desktop changelog as the release body now, so the notes exist even if the signing step fails.
      - name: Publish the release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: out/release-notes.md
          generate_release_notes: false      # the body is the changelog, not a commit list

      # Attach the UNSIGNED installers to the Release right away. This is the step that makes a release usable (and
      # the in-app updater able to point at a file) even before SignPath is set up: it must never be skipped because
      # signing is unavailable. The signed files, if any, are uploaded later and replace these.
      - name: Attach the UNSIGNED installers to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TryDesk-Setup-*.exe
            dist/TryDesk-Portable.exe
          fail_on_unmatched_files: true
          # No body here: the notes were published above and must stay untouched.

      # ── SignPath signing ──
      # Skipped unless the one-time setup above is done AND the repo variable SIGNPATH_ENABLED is "1". Marking the
      # two steps conditional (instead of letting an unfilled SignPath step fail the job) keeps every release green
      # and keeps the unsigned installers attached, while the signed ones are added on top once signing is live.
      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ENABLED == '1' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          github-token: ${{ github.token }}                 # lets SignPath fetch the artifact
          organization-id: "TODO-your-signpath-organization-id"
          project-slug: "trydesk"                           # TODO: your SignPath project slug
          signing-policy-slug: "release-signing"            # TODO: your SignPath policy slug
          # artifact-configuration-slug: "exe"              # uncomment + set if you named one
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "dist-signed"

      # Replace the unsigned installers with the SIGNED ones. Runs only after a real signing request, so a release
      # without signing keeps the files attached by the step above.
      - name: Publish SIGNED installers to the GitHub Release
        if: ${{ vars.SIGNPATH_ENABLED == '1' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist-signed/*.exe
          fail_on_unmatched_files: true
          # Do NOT add body / body_path / generate_release_notes here: the release body was already published from
          # CHANGELOG.md above (the desktop app's notes), and omitting them keeps that body untouched.
